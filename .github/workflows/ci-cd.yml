name: CI/CD

# CI: тесты на каждый push и pull request.
# CD: выкладка zip-артефакта библиотеки — только с ветки main.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: dependency
        run: pip install -r requirements.txt

      - name: test
        run: pytest -v --cov=grade_converter --cov-report=term-missing

  deploy:
    name: Deploy (zip)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip
        run: |
          mkdir -p dist
          zip -r dist/grade-converter.zip grade_converter README.md

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade-converter
          path: dist/grade-converter.zip
